<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本摘要 - NLP 流水线平台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .sent { padding: 8px 12px; border-radius: 8px; margin: 6px 0; border: 1px solid var(--border); }
    .sent.selected { background: var(--primary-soft); border-color: #c7d2fe; }
    .sent .score { float: right; font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
    .summary-box { font-size: 16px; line-height: 1.9; background: var(--primary-soft); border: 1px solid #c7d2fe; border-radius: 10px; padding: 18px 20px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="site-sidebar"></aside>

  <main class="main">
    <h1 class="page-title">文本摘要</h1>
    <p class="page-desc">基于 TextRank 的抽取式摘要：句子相似度建图 + PageRank 排序。</p>

    <section class="card">
      <label>输入文本（多句）</label>
      <textarea id="text" style="min-height:180px">自然语言处理是人工智能的重要分支。它研究如何让计算机理解、分析并生成人类语言。分词是自然语言处理的基础任务，其准确性直接影响下游任务。词性标注为每个词标注语法类别。命名实体识别从文本中抽取人名、地名与机构名。情感分析判断文本的正负面倾向。文本摘要自动提炼文章的核心内容。机器翻译实现不同语言之间的自动转换。这些技术共同构成了自然语言处理的核心体系。</textarea>
      <div class="row mt">
        <div style="flex:1">
          <label>摘要比例：<span id="ratio-val">30%</span></label>
          <input type="range" id="ratio" min="10" max="60" value="30">
        </div>
        <button class="btn" id="btn-sum">生成摘要</button>
      </div>
    </section>

    <section class="card">
      <h2>摘要结果</h2>
      <div class="summary-box" id="summary">尚未生成。</div>
    </section>

    <section class="card">
      <h2>句子重要度</h2>
      <div id="sentences" class="muted">尚未生成。</div>
    </section>
  </main>
</div>

<script src="/static/js/common.js"></script>
<script>
renderNav("summary.html");

$("#ratio").addEventListener("input", (e) => {
  $("#ratio-val").textContent = e.target.value + "%";
});

async function doSummary() {
  const text = $("#text").value.trim();
  if (!text) return toast("请输入文本", "err");
  const btn = $("#btn-sum");
  setLoading(btn, true, "生成中…");
  try {
    const ratio = parseInt($("#ratio").value) / 100;
    const r = await api("/api/summary", { method: "POST", body: { text, ratio } });
    $("#summary").textContent = r.summary;
    $("#sentences").innerHTML = r.sentences.map(s => `
      <div class="sent ${s.selected ? "selected" : ""}">
        <span class="score">${s.score}</span>
        ${s.selected ? '<span class="badge blue">入选</span> ' : ""}${esc(s.text)}
      </div>`).join("");
  } catch (e) { toast(e.message, "err"); }
  setLoading(btn, false);
}

$("#btn-sum").addEventListener("click", doSummary);
</script>
</body>
</html>
